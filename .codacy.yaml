---
engines:
  ai_reviewer:
    enabled: false

  eslint:
    enabled: true
    prefixes:
      - ts
      - js
    configurations:
      - .eslintrc.json
    exclude_patterns:
      - ".*\\bUnnecessary conditional.*"
      - ".*\\bUnexpected any.*"
      - ".*\\bUnhandled errors.*"

# 特定の警告を全局的に除外
# - Unnecessary conditional: 外部APIの返り値分析がCodacyでできないため
# - Unexpected any: Plugin SDKの型定義が未公開のためやむを得ない
# - Unhandled errors: throw文をエラー処理と認識しないCodacyの誤検知